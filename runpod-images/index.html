<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunPod Image Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #161618;      /* stage / deepest canvas */
      --bg-panel: #1e1e21;     /* side panel, top bar */
      --bg-card: #26262b;      /* inputs, thumbs, cards */
      --bg-card-hover: #2e2e34;
      --border: #34343a;
      --border-soft: #2a2a2f;
      --text-primary: #e8e8ea;
      --text-secondary: #9a9aa1;
      --text-muted: #67676e;
      --accent-cyan: #00ffcc;
      --accent-orange: #ffa657;
      --accent-red: #ff5470;
      --shadow-glow: rgba(0, 255, 204, 0.18);
      --panel-w: 380px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }
    html {
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* ---------- App shell ---------- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      flex-shrink: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .home-btn {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.18s;
    }
    .home-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }
    .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }
    .brand-title { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; }

    .conn {
      display: flex; align-items: center; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-secondary);
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .conn.ready .conn-dot {
      background: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--shadow-glow);
    }

    .workspace {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ---------- Left panel ---------- */
    .panel {
      width: var(--panel-w);
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .panel-scroll::-webkit-scrollbar,
    .stage-scroll::-webkit-scrollbar { width: 10px; }
    .panel-scroll::-webkit-scrollbar-thumb,
    .stage-scroll::-webkit-scrollbar-thumb {
      background: #3a3a40; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box;
    }
    .panel-scroll::-webkit-scrollbar-thumb:hover,
    .stage-scroll::-webkit-scrollbar-thumb:hover { background: #4a4a52; background-clip: padding-box; }

    .section { border-bottom: 1px solid var(--border-soft); }
    .section[open] { padding-bottom: 4px; }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
      user-select: none;
      list-style: none;
    }
    summary.section-head { cursor: pointer; }
    summary.section-head::-webkit-details-marker { display: none; }
    .chev {
      margin-left: auto;
      color: var(--text-muted);
      transition: transform 0.18s;
      font-size: 0.7rem;
    }
    details[open] > .section-head .chev { transform: rotate(90deg); }
    .section-icon { color: var(--text-muted); display: flex; }
    .section-body { padding: 2px 18px 18px; }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], input[type="password"], input[type="number"], textarea {
      width: 100%;
      padding: 9px 11px;
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      font-size: 0.9rem;
      color: var(--text-primary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--shadow-glow);
    }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    textarea {
      resize: vertical;
      line-height: 1.5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .input-wrap { position: relative; }
    .toggle-vis {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      transition: color 0.18s;
    }
    .toggle-vis:hover { color: var(--accent-cyan); }

    /* Panel footer (sticky generate) */
    .panel-footer {
      flex-shrink: 0;
      padding: 16px 18px;
      border-top: 1px solid var(--border);
      background: var(--bg-panel);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 12px 18px;
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #06231d;
      background: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn:hover:not(:disabled) { box-shadow: 0 0 0 3px var(--shadow-glow); filter: brightness(1.05); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      color: var(--text-secondary);
      background: transparent;
      border-color: var(--border);
    }
    .btn-ghost:hover:not(:disabled) {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: none; filter: none;
    }

    /* Status */
    .status-panel {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 11px 13px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 12px;
    }
    .status-panel.active { display: flex; }
    .status-spinner {
      width: 18px; height: 18px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-text { flex: 1; min-width: 0; }
    .status-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .status-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
      word-break: break-all;
    }
    .badge-queue { color: var(--accent-orange); }
    .badge-queue.dot { background: var(--accent-orange); }
    .badge-progress { color: var(--accent-cyan); }
    .badge-progress.dot { background: var(--accent-cyan); }
    .badge-done { color: var(--accent-cyan); }
    .badge-done.dot { background: var(--accent-cyan); }
    .badge-error { color: var(--accent-red); }
    .badge-error.dot { background: var(--accent-red); }

    /* ---------- Stage (gallery) ---------- */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-deep);
    }
    .stage-bar {
      flex-shrink: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border-soft);
      background: linear-gradient(to bottom, #1b1b1e, var(--bg-deep));
    }
    .stage-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .stage-title .count {
      color: var(--text-muted);
      font-size: 0.72rem;
    }
    .stage-actions { display: flex; align-items: center; gap: 18px; }

    .zoom { display: flex; align-items: center; gap: 9px; color: var(--text-muted); }
    .zoom svg { display: block; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 110px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-secondary);
      border: none;
      transition: background 0.16s;
    }
    input[type="range"]:hover::-webkit-slider-thumb { background: var(--accent-cyan); }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text-secondary); border: none; cursor: pointer;
    }
    input[type="range"]:hover::-moz-range-thumb { background: var(--accent-cyan); }

    .btn-mini {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.16s;
    }
    .btn-mini:hover { color: var(--accent-red); border-color: var(--accent-red); }

    .stage-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      min-height: 0;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--thumb, 220px), 1fr));
      gap: 14px;
      align-content: start;
    }

    .image-card {
      position: relative;
      aspect-ratio: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
      animation: fadeIn 0.35s ease-out;
    }
    .image-card:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 24px -12px rgba(0,0,0,0.7);
    }
    .image-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-card .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 11px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.25) 40%, transparent 70%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .image-card:hover .overlay { opacity: 1; }
    .image-card .ip {
      font-size: 0.78rem;
      color: #fff;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .image-card .it {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.6);
      margin-top: 6px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .empty-gallery {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      color: var(--text-muted);
      padding: 40px;
    }
    .empty-gallery svg { margin-bottom: 16px; opacity: 0.5; }
    .empty-gallery .et { font-size: 1.05rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .empty-gallery .es { font-size: 0.88rem; max-width: 320px; }

    /* ---------- Lightbox (loupe) ---------- */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(10,10,11,0.94);
      backdrop-filter: blur(6px);
      padding: 32px 88px;
    }
    .lightbox.active { display: flex; align-items: center; justify-content: center; }
    .lightbox-inner {
      max-width: 1200px;
      max-height: 100%;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 24px;
      align-items: center;
    }
    .lightbox-img-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: calc(100vh - 64px);
      min-height: 0;
    }
    .lightbox-img-wrap img {
      max-width: 100%;
      max-height: calc(100vh - 64px);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8);
    }
    .lightbox-side {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      align-self: stretch;
      max-height: calc(100vh - 64px);
      overflow-y: auto;
    }
    .lb-field { margin-bottom: 18px; }
    .lb-field .k {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .lb-field .v { font-size: 0.9rem; color: var(--text-primary); word-break: break-word; line-height: 1.5; }
    .lb-params { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--text-secondary); }
    .lb-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .lb-actions .btn { font-size: 0.88rem; padding: 10px 14px; }

    .close-lb {
      position: fixed;
      top: 20px; right: 24px;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.18s;
      z-index: 2001;
    }
    .close-lb:hover { color: var(--accent-red); border-color: var(--accent-red); }

    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.18s;
      z-index: 2001;
    }
    .lb-nav-prev { left: 22px; }
    .lb-nav-next { right: 22px; }
    .lb-nav:hover:not(:disabled) {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--shadow-glow);
    }
    .lb-nav:disabled { opacity: 0.25; cursor: not-allowed; }

    .lb-counter {
      position: fixed;
      top: 26px; left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      color: var(--text-secondary);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 15px;
      z-index: 2001;
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(150%);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.88rem;
      color: var(--text-primary);
      z-index: 3000;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      max-width: 90vw;
      box-shadow: 0 12px 40px -12px rgba(0,0,0,0.6);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--accent-red); }

    /* ---------- Responsive ---------- */
    @media (max-width: 880px) {
      html, body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      .workspace { flex-direction: column; }
      .panel { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .panel-scroll { overflow: visible; }
      .stage { min-height: 70vh; }
      .lightbox { padding: 20px; }
      .lightbox-inner { grid-template-columns: 1fr; align-content: start; align-items: start; overflow-y: auto; max-height: 100%; }
      .lb-nav { width: 40px; height: 40px; }
      .lb-nav-prev { left: 10px; }
      .lb-nav-next { right: 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <a href="/" class="home-btn" title="All tools">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="brand-text">
          <span class="brand-kicker">RunPod Serverless</span>
          <span class="brand-title">Image Studio</span>
        </div>
      </div>
      <div class="conn" id="conn">
        <span class="conn-dot" id="connDot"></span>
        <span id="connText">Not connected</span>
      </div>
    </header>

    <div class="workspace">
      <!-- Left controls panel -->
      <aside class="panel">
        <div class="panel-scroll">
          <details class="section" open>
            <summary class="section-head">
              <span class="section-icon">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              Connection
              <span class="chev">▸</span>
            </summary>
            <div class="section-body">
              <div class="field">
                <label for="endpointId">Endpoint ID</label>
                <input type="text" id="endpointId" placeholder="e.g. dd2577b8abc" autocomplete="off" spellcheck="false">
              </div>
              <div class="field">
                <label for="apiKey">API Key</label>
                <div class="input-wrap">
                  <input type="password" id="apiKey" placeholder="rpa_..." autocomplete="off" spellcheck="false">
                  <button class="toggle-vis" id="toggleKey" title="Show/hide" type="button">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </details>

          <div class="section" open>
            <div class="section-head">
              <span class="section-icon">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>
                </svg>
              </span>
              Prompt
            </div>
            <div class="section-body">
              <div class="field">
                <textarea id="prompt" rows="6" placeholder="astronaut riding a horse on mars, cinematic lighting, highly detailed"></textarea>
              </div>
              <div class="field">
                <label for="negativePrompt">Negative prompt</label>
                <textarea id="negativePrompt" rows="2" placeholder="blurry, bad quality, distorted"></textarea>
              </div>
            </div>
          </div>

          <details class="section" open>
            <summary class="section-head">
              <span class="section-icon">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
                </svg>
              </span>
              Parameters
              <span class="chev">▸</span>
            </summary>
            <div class="section-body">
              <div class="row2" style="margin-bottom:14px">
                <div>
                  <label for="width">Width</label>
                  <input type="number" id="width" value="1024" min="64" step="8">
                </div>
                <div>
                  <label for="height">Height</label>
                  <input type="number" id="height" value="1024" min="64" step="8">
                </div>
              </div>
              <div class="row2" style="margin-bottom:14px">
                <div>
                  <label for="steps">Steps</label>
                  <input type="number" id="steps" value="20" min="1" step="1">
                </div>
                <div>
                  <label for="guidance">Guidance (CFG)</label>
                  <input type="number" id="guidance" value="7.5" min="0" step="0.5">
                </div>
              </div>
              <div class="field">
                <label for="seed">Seed — blank for random</label>
                <input type="number" id="seed" placeholder="random" step="1">
              </div>
            </div>
          </details>
        </div>

        <!-- Sticky generate footer -->
        <div class="panel-footer">
          <button class="btn" id="generateBtn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            Generate
          </button>
          <button class="btn btn-ghost" id="cancelBtn" style="display:none; margin-top:10px">Cancel</button>

          <div class="status-panel" id="statusPanel">
            <span class="status-spinner" id="statusSpinner"></span>
            <span class="status-dot" id="statusDot" style="display:none"></span>
            <div class="status-text">
              <div class="status-label" id="statusLabel">Submitting…</div>
              <div class="status-sub" id="statusSub"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right gallery stage -->
      <main class="stage">
        <div class="stage-bar">
          <div class="stage-title">Library <span class="count" id="galleryCount">0</span></div>
          <div class="stage-actions">
            <div class="zoom" title="Thumbnail size">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
              <input type="range" id="thumbSize" min="150" max="380" value="220">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            </div>
            <button class="btn-mini" id="clearGallery" style="display:none">Clear all</button>
          </div>
        </div>
        <div class="stage-scroll">
          <div class="gallery-grid" id="galleryGrid"></div>
          <div class="empty-gallery" id="emptyGallery">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
            </svg>
            <div class="et">Your library is empty</div>
            <div class="es">Generated images appear here and persist locally in this browser. Write a prompt on the left and hit Generate.</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="close-lb" id="closeLb" title="Close (Esc)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-nav lb-nav-prev" id="lbPrev" title="Previous (←)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button class="lb-nav lb-nav-next" id="lbNext" title="Next (→)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <div class="lightbox-inner">
      <div class="lightbox-img-wrap"><img id="lbImg" src="" alt=""></div>
      <div class="lightbox-side">
        <div class="lb-field">
          <div class="k">Prompt</div>
          <div class="v" id="lbPrompt"></div>
        </div>
        <div class="lb-field" id="lbNegWrap">
          <div class="k">Negative</div>
          <div class="v" id="lbNeg"></div>
        </div>
        <div class="lb-field">
          <div class="k">Parameters</div>
          <div class="v lb-params" id="lbParams"></div>
        </div>
        <div class="lb-actions">
          <button class="btn" id="lbDownload">Download</button>
          <button class="btn btn-ghost" id="lbReuse">Reuse prompt</button>
          <button class="btn btn-ghost" id="lbDelete" style="color:var(--accent-red);border-color:var(--accent-red)">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const API_BASE = 'https://api.runpod.ai/v2';
    const LS = { endpoint: 'runpod_endpoint_id', key: 'runpod_api_key', params: 'runpod_last_params', thumb: 'runpod_thumb' };

    // ---- IndexedDB for gallery (base64 images can be large) ----
    let db;
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('runpod-images', 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('images')) {
            d.createObjectStore('images', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = () => reject(req.error);
      });
    }
    function dbAll() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readonly');
        const req = tx.objectStore('images').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }
    function dbPut(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    function dbDelete(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    function dbClear() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('images', 'readwrite');
        tx.objectStore('images').clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // ---- Credentials & param persistence ----
    function loadCreds() {
      $('endpointId').value = localStorage.getItem(LS.endpoint) || '';
      $('apiKey').value = localStorage.getItem(LS.key) || '';
      try {
        const p = JSON.parse(localStorage.getItem(LS.params) || '{}');
        if (p.width) $('width').value = p.width;
        if (p.height) $('height').value = p.height;
        if (p.steps) $('steps').value = p.steps;
        if (p.guidance) $('guidance').value = p.guidance;
      } catch {}
    }
    function updateConn() {
      const ok = $('endpointId').value.trim() && $('apiKey').value.trim();
      $('conn').classList.toggle('ready', !!ok);
      $('connText').textContent = ok ? 'Ready' : 'Not connected';
    }
    $('endpointId').addEventListener('input', () => { localStorage.setItem(LS.endpoint, $('endpointId').value.trim()); updateConn(); });
    $('apiKey').addEventListener('input', () => { localStorage.setItem(LS.key, $('apiKey').value.trim()); updateConn(); });

    $('toggleKey').addEventListener('click', () => {
      const f = $('apiKey');
      f.type = f.type === 'password' ? 'text' : 'password';
    });

    // ---- Thumbnail zoom ----
    function applyThumb() {
      document.documentElement.style.setProperty('--thumb', $('thumbSize').value + 'px');
    }
    $('thumbSize').addEventListener('input', () => { applyThumb(); localStorage.setItem(LS.thumb, $('thumbSize').value); });

    // ---- Toast ----
    let toastTimer;
    function toast(msg, isError) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.toggle('error', !!isError);
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    // ---- Status panel ----
    function setStatus(state, label, sub) {
      const panel = $('statusPanel');
      panel.classList.add('active');
      $('statusLabel').textContent = label;
      $('statusSub').textContent = sub || '';
      const spinner = $('statusSpinner');
      const dot = $('statusDot');
      const labelEl = $('statusLabel');
      labelEl.className = 'status-label';
      dot.className = 'status-dot';
      if (state === 'queue') {
        spinner.style.display = ''; dot.style.display = 'none';
        labelEl.classList.add('badge-queue');
      } else if (state === 'progress') {
        spinner.style.display = ''; dot.style.display = 'none';
        labelEl.classList.add('badge-progress');
      } else if (state === 'done') {
        spinner.style.display = 'none'; dot.style.display = '';
        dot.classList.add('badge-done', 'dot'); labelEl.classList.add('badge-done');
      } else if (state === 'error') {
        spinner.style.display = 'none'; dot.style.display = '';
        dot.classList.add('badge-error', 'dot'); labelEl.classList.add('badge-error');
      }
    }
    function hideStatusLater() {
      setTimeout(() => { if (!polling) $('statusPanel').classList.remove('active'); }, 4000);
    }

    // ---- Generation flow ----
    let polling = false;
    let cancelled = false;
    let currentJobId = null;

    function authHeaders(key) {
      return { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' };
    }

    async function generate() {
      const endpoint = $('endpointId').value.trim();
      const key = $('apiKey').value.trim();
      const prompt = $('prompt').value.trim();

      if (!endpoint) return toast('Enter your endpoint ID first', true);
      if (!key) return toast('Enter your API key first', true);
      if (!prompt) return toast('Enter a prompt first', true);

      const params = {
        prompt,
        negative_prompt: $('negativePrompt').value.trim(),
        width: parseInt($('width').value) || 1024,
        height: parseInt($('height').value) || 1024,
        num_inference_steps: parseInt($('steps').value) || 20,
        guidance_scale: parseFloat($('guidance').value) || 7.5,
      };
      const seedRaw = $('seed').value.trim();
      if (seedRaw !== '') params.seed = parseInt(seedRaw);

      // persist non-prompt params
      localStorage.setItem(LS.params, JSON.stringify({
        width: params.width, height: params.height,
        steps: params.num_inference_steps, guidance: params.guidance_scale
      }));

      cancelled = false;
      setGenerating(true);
      setStatus('queue', 'Submitting job…', '');

      let jobId;
      try {
        const res = await fetch(`${API_BASE}/${endpoint}/run`, {
          method: 'POST',
          headers: authHeaders(key),
          body: JSON.stringify({ input: params })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        jobId = data.id;
        if (!jobId) throw new Error('No job id returned');
        currentJobId = jobId;
        setStatus(statusState(data.status), prettyStatus(data.status || 'IN_QUEUE'), 'Job ' + jobId);
      } catch (err) {
        setStatus('error', 'Failed to submit', err.message);
        toast('Submit failed: ' + err.message, true);
        setGenerating(false);
        return;
      }

      // Poll status
      polling = true;
      try {
        const output = await pollStatus(endpoint, key, jobId, params);
        if (cancelled) return;
        await handleOutput(output, params);
      } catch (err) {
        if (cancelled) return;
        setStatus('error', 'Generation failed', err.message);
        toast(err.message, true);
      } finally {
        polling = false;
        currentJobId = null;
        setGenerating(false);
      }
    }

    function statusState(s) {
      if (s === 'IN_PROGRESS') return 'progress';
      if (s === 'COMPLETED') return 'done';
      if (s === 'FAILED' || s === 'CANCELLED' || s === 'TIMED_OUT') return 'error';
      return 'queue';
    }
    function prettyStatus(s) {
      const map = {
        IN_QUEUE: 'In queue', IN_PROGRESS: 'Processing…', COMPLETED: 'Completed',
        FAILED: 'Failed', CANCELLED: 'Cancelled', TIMED_OUT: 'Timed out'
      };
      return map[s] || s;
    }

    async function pollStatus(endpoint, key, jobId, params) {
      const start = Date.now();
      while (true) {
        if (cancelled) throw new Error('Cancelled');
        await sleep(1500);
        if (cancelled) throw new Error('Cancelled');
        let data;
        try {
          const res = await fetch(`${API_BASE}/${endpoint}/status/${jobId}`, { headers: authHeaders(key) });
          data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        } catch (err) {
          // transient network error — keep trying for a bit
          continue;
        }
        const s = data.status;
        const elapsed = Math.floor((Date.now() - start) / 1000);
        if (s === 'IN_QUEUE') {
          setStatus('queue', 'In queue', `Waiting for a worker · ${elapsed}s`);
        } else if (s === 'IN_PROGRESS') {
          setStatus('progress', 'Processing…', `Generating · ${elapsed}s`);
        } else if (s === 'COMPLETED') {
          setStatus('done', 'Completed', `Done in ${elapsed}s`);
          return data.output;
        } else if (s === 'FAILED') {
          throw new Error('Job failed: ' + (typeof data.error === 'string' ? data.error : JSON.stringify(data.output || data.error || 'unknown')));
        } else if (s === 'CANCELLED') {
          throw new Error('Job was cancelled');
        } else if (s === 'TIMED_OUT') {
          throw new Error('Job timed out');
        } else {
          setStatus('queue', prettyStatus(s || 'IN_QUEUE'), `${elapsed}s`);
        }
      }
    }

    function extractImages(output) {
      // Handle common runpod image-worker shapes
      if (!output) return [];
      if (Array.isArray(output)) return output.flatMap(extractImages);
      if (output.images && Array.isArray(output.images)) return output.images;
      if (output.image) return [output.image];
      if (typeof output === 'string') return [output];
      return [];
    }

    function toDataUrl(img) {
      if (typeof img !== 'string') {
        if (img && img.image) img = img.image;
        else return null;
      }
      if (img.startsWith('data:')) return img;
      if (/^https?:\/\//.test(img)) return img;
      return 'data:image/png;base64,' + img;
    }

    async function handleOutput(output, params) {
      const raw = extractImages(output);
      const urls = raw.map(toDataUrl).filter(Boolean);
      if (!urls.length) {
        setStatus('error', 'No images in response', 'The worker returned no image data');
        toast('No images found in the response', true);
        return;
      }
      // parse seed from info if present
      let seed = params.seed;
      try {
        if (output && output.info) {
          const info = JSON.parse(output.info);
          if (info.seed != null) seed = info.seed;
        }
      } catch {}

      for (const url of urls) {
        const item = {
          id: crypto.randomUUID(),
          src: url,
          prompt: params.prompt,
          negative_prompt: params.negative_prompt || '',
          width: params.width,
          height: params.height,
          steps: params.num_inference_steps,
          guidance: params.guidance_scale,
          seed: seed,
          createdAt: Date.now()
        };
        await dbPut(item);
        prependCard(item);
      }
      refreshGalleryChrome();
      toast(urls.length > 1 ? `${urls.length} images added to library` : 'Image added to library');
      hideStatusLater();
    }

    async function cancelJob() {
      cancelled = true;
      polling = false;
      const endpoint = $('endpointId').value.trim();
      const key = $('apiKey').value.trim();
      if (currentJobId) {
        fetch(`${API_BASE}/${endpoint}/cancel/${currentJobId}`, { method: 'POST', headers: authHeaders(key) }).catch(() => {});
      }
      setStatus('error', 'Cancelled', '');
      setGenerating(false);
      hideStatusLater();
    }

    function setGenerating(on) {
      $('generateBtn').disabled = on;
      $('cancelBtn').style.display = on ? 'inline-flex' : 'none';
    }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // ---- Gallery rendering ----
    let galleryItems = [];
    function fmtTime(ts) {
      const d = new Date(ts);
      return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function makeCard(item) {
      const card = document.createElement('div');
      card.className = 'image-card';
      card.dataset.id = item.id;
      const img = document.createElement('img');
      img.src = item.src;
      img.loading = 'lazy';
      img.alt = item.prompt || '';
      const ov = document.createElement('div');
      ov.className = 'overlay';
      const p = document.createElement('div');
      p.className = 'ip';
      p.textContent = item.prompt || '(no prompt)';
      const tm = document.createElement('div');
      tm.className = 'it';
      tm.textContent = fmtTime(item.createdAt);
      ov.appendChild(p); ov.appendChild(tm);
      card.appendChild(img); card.appendChild(ov);
      card.addEventListener('click', () => openLightbox(item));
      return card;
    }

    function prependCard(item) {
      galleryItems.unshift(item);
      $('galleryGrid').prepend(makeCard(item));
    }

    function refreshGalleryChrome() {
      const n = $('galleryGrid').children.length;
      $('emptyGallery').style.display = n ? 'none' : 'flex';
      $('clearGallery').style.display = n ? 'inline-flex' : 'none';
      $('galleryCount').textContent = n;
    }

    async function renderGallery() {
      galleryItems = (await dbAll()).sort((a, b) => b.createdAt - a.createdAt);
      const grid = $('galleryGrid');
      grid.innerHTML = '';
      galleryItems.forEach(it => grid.appendChild(makeCard(it)));
      refreshGalleryChrome();
    }

    $('clearGallery').addEventListener('click', async () => {
      if (!confirm('Delete all images from the library? This cannot be undone.')) return;
      await dbClear();
      await renderGallery();
      toast('Library cleared');
    });

    // ---- Lightbox ----
    let lbItem = null;
    let lbIndex = -1;

    function renderLb(item) {
      lbItem = item;
      $('lbImg').src = item.src;
      $('lbPrompt').textContent = item.prompt || '(no prompt)';
      if (item.negative_prompt) {
        $('lbNegWrap').style.display = '';
        $('lbNeg').textContent = item.negative_prompt;
      } else {
        $('lbNegWrap').style.display = 'none';
      }
      const parts = [
        `${item.width}×${item.height}`,
        `${item.steps} steps`,
        `cfg ${item.guidance}`,
        item.seed != null ? `seed ${item.seed}` : null
      ].filter(Boolean);
      $('lbParams').textContent = parts.join('  ·  ');
      // counter + nav button state
      $('lbCounter').textContent = `${lbIndex + 1} / ${galleryItems.length}`;
      $('lbPrev').disabled = lbIndex <= 0;
      $('lbNext').disabled = lbIndex >= galleryItems.length - 1;
    }

    function openLightbox(item) {
      lbIndex = galleryItems.findIndex(i => i.id === item.id);
      if (lbIndex === -1) { lbIndex = 0; }
      renderLb(galleryItems[lbIndex] || item);
      $('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function navLightbox(delta) {
      const next = lbIndex + delta;
      if (next < 0 || next >= galleryItems.length) return;
      lbIndex = next;
      renderLb(galleryItems[lbIndex]);
    }
    function closeLightbox() {
      $('lightbox').classList.remove('active');
      document.body.style.overflow = '';
      lbItem = null;
      lbIndex = -1;
    }
    $('closeLb').addEventListener('click', closeLightbox);
    $('lbPrev').addEventListener('click', () => navLightbox(-1));
    $('lbNext').addEventListener('click', () => navLightbox(1));
    $('lightbox').addEventListener('click', (e) => { if (e.target === $('lightbox')) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (!$('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') { e.preventDefault(); navLightbox(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); navLightbox(1); }
    });

    $('lbDownload').addEventListener('click', () => {
      if (!lbItem) return;
      const a = document.createElement('a');
      a.href = lbItem.src;
      const slug = (lbItem.prompt || 'image').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40).replace(/^-|-$/g, '');
      a.download = `runpod-${slug || 'image'}-${lbItem.seed ?? ''}.png`;
      a.click();
    });
    $('lbReuse').addEventListener('click', () => {
      if (!lbItem) return;
      $('prompt').value = lbItem.prompt || '';
      $('negativePrompt').value = lbItem.negative_prompt || '';
      if (lbItem.width) $('width').value = lbItem.width;
      if (lbItem.height) $('height').value = lbItem.height;
      if (lbItem.steps) $('steps').value = lbItem.steps;
      if (lbItem.guidance) $('guidance').value = lbItem.guidance;
      closeLightbox();
      $('prompt').focus();
      toast('Prompt loaded into the form');
    });
    $('lbDelete').addEventListener('click', async () => {
      if (!lbItem) return;
      const id = lbItem.id;
      await dbDelete(id);
      const el = document.querySelector(`.image-card[data-id="${id}"]`);
      if (el) el.remove();
      const removedIndex = galleryItems.findIndex(i => i.id === id);
      if (removedIndex !== -1) galleryItems.splice(removedIndex, 1);
      refreshGalleryChrome();
      toast('Image deleted');
      // stay in the lightbox on the neighbouring image, or close if none left
      if (galleryItems.length === 0) {
        closeLightbox();
      } else {
        lbIndex = Math.min(removedIndex, galleryItems.length - 1);
        renderLb(galleryItems[lbIndex]);
      }
    });

    $('generateBtn').addEventListener('click', generate);
    $('cancelBtn').addEventListener('click', cancelJob);

    // Ctrl/Cmd+Enter to generate from the prompt box
    $('prompt').addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') generate();
    });

    // ---- Init ----
    (async () => {
      loadCreds();
      updateConn();
      const savedThumb = localStorage.getItem(LS.thumb);
      if (savedThumb) $('thumbSize').value = savedThumb;
      applyThumb();
      try {
        await openDB();
        await renderGallery();
      } catch (err) {
        toast('Could not open local storage for the gallery', true);
      }
    })();
  </script>
</body>
</html>
