services:
  voxtral:
    image: vllm/vllm-openai:nightly
    runtime: nvidia
    ports:
      - "18000:8000"
    volumes:
      - voxtral-cache:/root/.cache/huggingface
    environment:
      - VLLM_DISABLE_COMPILE_CACHE=1
      # Set your HuggingFace token if the model requires auth
      # - HF_TOKEN=hf_xxxxx
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install -q 'mistral-common[soundfile]' &&
        vllm serve mistralai/Voxtral-Mini-4B-Realtime-2602 \
          --compilation_config '{"cudagraph_mode": "PIECEWISE"}' \
          --dtype bfloat16 \
          --gpu-memory-utilization 0.50 \
          --max-model-len 16384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  voxtral-cache:
